# Configurazione Fase 1 - sharpening del termico Sentinel-3 con Sentinel-2, validazione con Landsat

# Area di ADDESTRAMENTO: grande, per avere abbastanza pixel da 1 km (circa 40 x 40 km, Delta del Po e Polesine)
training_aoi:
  name: po_delta_training
  west: 12.05
  south: 44.78
  east: 12.55
  north: 45.14

# Area di ANALISI: dove produciamo le mappe a 20 m (la stessa dello Step 2)
analysis_aoi:
  name: po_delta_porto_tolle
  west: 12.25
  south: 44.88
  east: 12.45
  north: 45.02

# Periodo in cui cercare le date con passaggio comune (estate della siccita' 2022)
search_period:
  start: "2022-06-01"
  end: "2022-09-01"

# Ricerca dei giorni con S2 + S3 + Landsat sereni sull'area (p1_01)
date_search:
  years: [2019, 2020, 2021, 2022, 2023, 2024, 2025]
  months: [4, 9]                 # da aprile a settembre (stagione irrigua)
  max_cloud_s2_scene: 60         # soglie LARGHE sulla scena intera (S2 110 km, Landsat 185 km)...
  max_cloud_landsat_scene: 60
  min_clear_fraction: 0.85       # ...poi controllo vero: >= 85% di terraferma limpida SULL'AREA
  s3_day_hours_utc: [8, 12]      # solo passaggi diurni di Sentinel-3

catalogs:
  cdse_stac: https://stac.dataspace.copernicus.eu/v1
  s2_collection: sentinel-2-l2a
  s2_collection_pc: sentinel-2-l2a   # stessa collezione su Planetary Computer (maschera SCL in COG)
  s3_collection: sentinel-3-sl-2-lst-ntc
  landsat_stac: https://planetarycomputer.microsoft.com/api/stac/v1
  landsat_collection: landsat-c2-l2
  landsat_platforms: [landsat-8, landsat-9]

# Giorno di riferimento scelto con p1_01_find_dates.py
reference_date: "2022-07-19"

download:
  output_crs: 32633         # UTM 33N, uguale per tutti i dati
  s2_collection: SENTINEL2_L2A
  # Tutte le bande utili a 20 m: visibile, red-edge, NIR, SWIR + classificazione della scena
  s2_bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12, SCL]
  s2_resolution_m: 20
  s3_collection: SENTINEL3_SLSTR_L2_LST
  s3_bands: [LST, confidence_in]
  s3_resolution_m: 1000
  landsat_platforms: [landsat-8, landsat-9]   # Landsat usato per validare, se passa quel giorno
  # File Landsat da prendere: temperatura superficiale e qualita' del pixel
  landsat_assets: [lwir11, qa_pixel]

# Preparazione della tabella di addestramento (predittori a 1 km -> LST Sentinel-3)
training:
  # Passaggio Sentinel-3 da usare: "auto" = il diurno (8-12 UTC) con piu' pixel limpidi.
  # Per il 19/07/2022 e' fissato alle 09:58 (simultaneo a Landsat 9) nella sezione "dates".
  s3_time_utc: auto
  # Classi SCL di Sentinel-2 considerate "terra limpida": 4 vegetazione, 5 suolo nudo/non vegetato
  s2_valid_scl: [4, 5]
  # Un pixel da 1 km entra nell'addestramento solo se almeno questa frazione dei suoi
  # pixel da 20 m e' terra limpida (compromesso tra quantita' e purezza dei campioni)
  min_valid_fraction: 0.9
  # Soglie da provare nell'analisi di sensibilita' (solo conteggio dei pixel)
  sensitivity_fractions: [0.5, 0.7, 0.8, 0.9, 1.0]
  # Risposta spaziale (PSF) di Sentinel-3: ogni pixel "vede" un'area piu' ampia di 1 km.
  # Stimata confrontando S3 con Landsat sfocato: massima correlazione a sigma ~500 m.
  # Si applica la stessa sfocatura gaussiana a Sentinel-2 prima di aggregarlo. 0 = nessuna.
  psf_sigma_m: 500

# Confronto dei modelli (predittori a 1 km -> LST)
models:
  predictors: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12, NDVI, NDMI]
  cv_block_km: 5          # lato dei blocchi per la validazione incrociata spaziale
  cv_folds: 5             # numero di gruppi (fold)
  random_seed: 42         # rende i risultati ripetibili
  rf_trees: 300           # alberi della foresta casuale
  rf_min_samples_leaf: 5  # ogni "foglia" deve contenere almeno 5 pixel: limita l'overfitting

# Sharpening a 20 m e validazione con Landsat
sharpening:
  models: ["Foresta casuale", "Lineare tutte"]  # il primo e' il modello principale (figure)
  validation_resolution_m: 100   # Landsat ha termico nativo a 100 m: confrontiamo a quella scala
  min_valid_fraction: 0.9        # cella da 100 m usata solo se >= 90% dei pixel fini e' valido
  predict_chunk: 500000          # pixel previsti per blocco (limita l'uso di memoria)

# Meteo ERA5-Land (Copernicus Climate Data Store) per il bilancio energetico
meteo:
  dataset: reanalysis-era5-land
  variables:
    - 2m_temperature                      # temperatura dell'aria a 2 m
    - 2m_dewpoint_temperature             # punto di rugiada -> pressione di vapore
    - 10m_u_component_of_wind             # vento verso est a 10 m
    - 10m_v_component_of_wind             # vento verso nord a 10 m
    - surface_pressure                    # pressione al suolo
    - surface_solar_radiation_downwards   # radiazione solare in arrivo (CUMULATA dalle 00 UTC)
    - surface_thermal_radiation_downwards # radiazione infrarossa dall'atmosfera (CUMULATA)
  margin_deg: 0.2          # margine attorno all'area di addestramento (celle ERA5-Land da ~0,1°)
  overpass_hour_utc: 10    # ora piu' vicina al passaggio dei satelliti (09:58)

# Parametri biofisici della vegetazione (LAI, copertura, FAPAR) da Sentinel-2
biophysical:
  # Metodo principale: processore biofisico di ESA SNAP (Weiss & Baret), 8 bande + 3 angoli
  snap_version: "2_1"
  snap_url: https://raw.githubusercontent.com/senbox-org/s2tbx/master/s2tbx-biophysical/src/main/resources/auxdata
  snap_variables: [LAI, FCOVER, FAPAR]
  snap_bands: [B03, B04, B05, B06, B07, B8A, B11, B12]   # ordine richiesto dalla rete
  angle_bands: [sunZenithAngles, sunAzimuthAngles, viewZenithMean, viewAzimuthMean]
  # Confronto: servizio BIOPAR su openEO (versione a 3 bande B03, B04, B08)
  biopar_namespace: https://raw.githubusercontent.com/ESA-APEx/apex_algorithms/refs/heads/main/algorithm_catalog/vito/biopar/openeo_udp/biopar.json
  biopar_type: LAI

# Bilancio energetico a due sorgenti (pyTSEB, versione Priestley-Taylor)
tseb:
  lst_file: lst_sharpened_foresta_casuale.tif   # LST a 20 m dallo sharpening
  lai_file: lai_snap.tif                        # LAI principale (SNAP)
  fapar_file: fapar_snap.tif                    # per la frazione verde f_g = FAPAR / FIPAR
  overpass_utc: auto            # uguale al passaggio Sentinel-3 scelto (impostato da config_utils)
  # Altezze di misura del meteo ERA5-Land
  z_u_m: 10.0              # vento a 10 m
  z_T_m: 2.0               # temperatura a 2 m
  # Altezza della chioma: non misurata -> stimata dal LAI (ipotesi da dichiarare)
  # h = h_min + (h_max - h_min) * min(LAI / lai_at_hmax, 1)
  # h_max 1,8 m: la temperatura a 2 m deve restare SOPRA la chioma (teoria di Monin-Obukhov)
  h_min_m: 0.05
  h_max_m: 1.8
  lai_at_hmax: 4.0
  leaf_width_m: 0.05       # larghezza tipica delle foglie di colture erbacee
  emis_C: 0.98             # emissivita' delle foglie
  emis_S: 0.95             # emissivita' del suolo
  # Proprieta' ottiche di foglie e suolo per dividere la radiazione solare (valori tipici)
  rho_leaf_vis: 0.07
  tau_leaf_vis: 0.08
  rho_leaf_nir: 0.32
  tau_leaf_nir: 0.33
  rho_soil_vis: 0.15
  rho_soil_nir: 0.25
  vza_deg: 0.0             # angolo di vista del termico (semplificazione: vista verticale)
  lambda_J_kg: 2450000.0     # calore di vaporizzazione dell'acqua
  vegetated_lai_min: 0.5   # pixel "vegetati" per le statistiche di stress
  # Correzione della temperatura dell'aria ERA5 (K). 0 finche' non c'e' una stazione a supporto.
  ta_offset_K: auto          # 'auto' = dal confronto con la stazione (p2_05); oppure un numero
  # Sensibilita' calcolata automaticamente su un campione di pixel (in piu' rispetto a ta_offset_K)
  sens_ta_offsets_K: [-1, 0, 1]
  # Mappa colturale EUCROPMAP 2022 a 20 m (da p2_06)
  cropmap_file: eucropmap_2022_20m.tif
  exclude_classes: [0, 100, 700, 800]   # nessun dato, edificato, acqua, zone umide
  # Altezza massima tipica a meta' luglio (m); il LAI scala tra h_min e questo valore.
  # Cereali vernini gia' trebbiati: se c'e' LAI alto e' una coltura in secondo raccolto (es. soia).
  crop_h_max_m:
    211: 0.8     # frumento tenero (stoppie o secondo raccolto)
    212: 0.8     # frumento duro
    213: 0.8     # orzo
    216: 2.5     # mais
    217: 1.0     # riso
    221: 0.6     # patate
    222: 0.6     # barbabietola
    231: 1.8     # girasole
    233: 0.8     # soia
    240: 0.7     # legumi secchi
    250: 0.6     # foraggere (erba medica)
    290: 0.3     # seminativo nudo
    300: 4.0     # bosco, frutteti, pioppeti
    500: 0.4     # prati
    600: 0.1     # suolo nudo
  # Quote del meteo misurate sopra il piano di spostamento d_0 (necessario con chiome > 2 m)
  heights_above_d0: true
  # Altezza della chioma: "coltura" (EUCROPMAP 2022, piu' precisa nel 2022) oppure "lai"
  # (stessa regola per tutti: coerente nel confronto tra anni con colture diverse).
  # Si puo' cambiare al volo con --altezza coltura|lai.
  height_source: coltura

# Stress idrico (Step 2d)
stress:
  lai_min: 0.5            # sotto e' quasi suolo nudo: lo "stress" non ha senso
  f_g_min: 0.5            # chioma almeno per meta' verde (esclude stoppie)
  lai_bins: [0.5, 1, 2, 3, 4, 8]   # classi di LAI per l'indice contestuale
  p_wet: 2                # percentile freddo (campi ben irrigati)
  p_dry: 98               # percentile caldo (campi senz'acqua)
  stress_threshold: 0.3   # CWSI oltre cui un pixel e' considerato stressato

# Validazione con ECOSTRESS (NASA, ISS, 70 m) - Step 3
ecostress:
  start: "2022-06-15"
  end: "2022-08-31"
  hours_utc: [8, 12]        # passaggi a meta' mattina, confrontabili con Sentinel-3 (~10 UTC)
  min_coverage: 0.5         # almeno meta' dell'area di analisi dentro il tassello
  max_cloud_pct: 10         # nuvole sulla terraferma dell'area
  compare_resolution_m: 500 # scala del confronto: ECOSTRESS e' meno nitido dei 70 m nominali

# Contesto climatico (p4_01): pioggia e temperatura ERA5-Land mensili 1991-2025
climate:
  margin_deg: 0.3          # margine attorno all'area: servono abbastanza celle di terra

# Confronto siccita' (p4_02): 2022 contro anni di riferimento, stesse finestre stagionali
drought:
  target_year: 2022
  reference_years: [2023, 2024, 2025]
  dates:
    2022: ["2022-06-02", "2022-06-27", "2022-07-19", "2022-07-29", "2022-08-11"]   # 01/08: Sentinel-3 senza dati
    2023: ["2023-06-12", "2023-06-29", "2023-07-14", "2023-08-11", "2023-08-23"]
    2024: ["2024-06-06", "2024-06-28", "2024-07-16", "2024-07-28", "2024-08-15"]
    2025: ["2025-06-10", "2025-06-28", "2025-07-20", "2025-07-31", "2025-08-12"]
  min_dates: 3                # date valide minime per pixel per calcolare la media di un anno
  season_days: 92             # giugno-agosto, per l'ordine di grandezza del volume
  distance_bins_km: [0, 2, 4, 6, 8, 10, 15, 25]
  cropmap_wide_file: eucropmap_2022_training_aoi.tif   # area ampia: serve per la distanza dal mare

# Confronto con WaPOR L1 (FAO, 300 m, decadale) - p4_03
wapor:
  years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  months: [6, 8]            # giugno-agosto, 9 decadi per anno
  margin_deg: 0.02          # piccolo margine attorno all'area di analisi

# Stazioni a terra per verificare il meteo ERA5-Land
stations:
  file: data/ancillary/stations/arpae_giralda_{date}.csv
  file_year: data/ancillary/stations/arpae_giralda_{year}.csv   # alternativa: un file per estate
  precip_file: data/ancillary/stations/arpae_giralda_precip_2019_2025.csv   # pioggia giornaliera   # ARPAE-SIMC Dext3r, CC BY 4.0

# Mappa colturale europea 2022 (JRC EUCROPMAP, 10 m, CC BY 4.0)
cropmap:
  url: https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/EUCROPMAP/2022/EU_CropMap_22_v1_stratum_EU27-HR.tif
  legend:
    100: Artificiale
    211: Frumento tenero
    212: Frumento duro
    213: Orzo
    214: Segale
    215: Avena
    216: Mais
    217: Riso
    218: Triticale
    219: Altri cereali
    221: Patate
    222: Barbabietola da zucchero
    223: Altre radici
    230: Altre industriali
    231: Girasole
    232: Colza
    233: Soia
    240: Legumi secchi
    250: Foraggere
    290: Seminativo nudo
    300: Bosco e arbusti (incl. colture permanenti)
    500: Prati
    600: Suolo nudo
    700: Acqua
    800: Zone umide

# Eccezioni valide per una sola data (si sovrappongono alle impostazioni sopra)
dates:
  "2022-07-19":
    training:
      s3_time_utc: "09:58"      # passaggio simultaneo a Landsat 9

# Percorsi: {date} viene sostituito con la data elaborata (es. 20220811)
paths:
  raw: data/raw/p1_{date}
  processed: data/processed/p1_{date}
  tables: outputs/{date}/tables
  figures: outputs/{date}/figures
  summaries: outputs/{date}
  tables_common: outputs/tables      # risultati che non dipendono dalla data
  figures_common: outputs/figures
  aux: data/ancillary
